name: release

# Runs ONLY in tiefgang-gmbh/actions, by hand. This repository is a
# mirror written by the monorepo's CI; a release is a tag and a GitHub
# Release, never a commit. The version comes from the conventional
# commits since the last tag (cliff.toml); `version` overrides it and is
# how 1.0.0 is cut. Every action shares this one version line.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit version (X.Y.Z); empty = computed from the commits since the last tag
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Puts git-cliff on PATH for the steps below (the action's own
      # installer never does). The tool version is pinned to the one the
      # bump rules in cliff.toml were verified against.
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: git-cliff@2.14.1

      - name: Compute the next version
        id: next
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -eu
          current="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo none)"
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be X.Y.Z"; exit 1; }
            next="v$REQUESTED"
            if [ "$current" != none ]; then
              if [ "$next" = "$current" ]; then
                echo "::error::$next is already released"; exit 1
              fi
              if [ "$(printf '%s\n%s\n' "$current" "$next" | sort -V | tail -1)" != "$next" ]; then
                echo "::error::$next is not greater than $current"; exit 1
              fi
            fi
          else
            next="$(git-cliff --bumped-version)"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current: $current, next: $next"

      - name: Nothing to release
        if: steps.next.outputs.next == steps.next.outputs.current
        env:
          CURRENT: ${{ steps.next.outputs.current }}
        run: echo "no releasable commit since $CURRENT"

      - name: Render the notes
        if: steps.next.outputs.next != steps.next.outputs.current
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: git-cliff --unreleased --tag "$NEXT" --strip all -o notes.md && cat notes.md

      - name: Tag, move the major tag, push, release
        if: steps.next.outputs.next != steps.next.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -eu
          git -c user.name=github-actions -c user.email=github-actions@github.com tag -a "$NEXT" -m "$NEXT"
          major="${NEXT%%.*}"
          old="$(git rev-parse -q --verify "refs/tags/$major" || true)"
          git tag -f "$major" "$NEXT"
          git push origin "refs/tags/$NEXT"
          if [ -n "$old" ]; then
            git push --force-with-lease="refs/tags/$major:$old" origin "refs/tags/$major"
          else
            git push origin "refs/tags/$major"
          fi
          gh release create "$NEXT" --title "$NEXT" --notes-file notes.md
